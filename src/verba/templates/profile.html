{% extends "base.html" %}

{% block title %}Profile | Verba{% endblock %}

{% block content %}
<div class="container-xl py-4">
  <div class="profile-wrap">

    <!-- هدر پروفایل -->
    <div class="profile-header">
      <div class="d-flex align-items-center gap-3" style="position: relative; min-width: 0;">
        <div class="profile-avatar">{{ username|slice:":1"|upper }}</div>
        <div class="profile-info">
          <p class="profile-label">Username</p>
          <h2 class="profile-name" dir="auto">{{ username }}</h2>
        </div>
      </div>

      <a href="{% url 'edit_profile' %}" class="edit-btn">✏️ Edit Profile</a>
    </div>

    <!-- آمار -->
    <div class="stat-grid">
      <div class="stat-card accent-1">
        <span class="stat-icon">🗂️</span>
        <p class="stat-label">Cards</p>
        <p class="stat-value">{{ cards }}</p>
      </div>
    </div>

  </div>
</div>
{% endblock %}
