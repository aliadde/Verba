{% extends "base.html" %}

{% block title %}Home | Verba{% endblock %}

{% block content %}
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-xl-6">
                <div class="card card-sm mt-5">
                    <div class="card-body my-3">
                        <h3 class="text-center mb-3 pb-3">login</h3>
                        <form method="POST">
                            {% csrf_token %}

                            <div class="m-2">
                                <label class="form-label">Username</label>
                                {{ form.username }}
                            </div>

                            <div class="m-2">
                                <label class="form-label">Password</label>
                                {{ form.password }}
                            </div>

                            {% if form.non_field_errors %}
                                <div class="text-danger m-2">
                                    {{ form.non_field_errors }}
                                </div>
                            {% endif %}

                            <div class="m-2 text-center">
                                <button type="submit" class="btn btn-primary">
                                    Log In
                                </button>
                            </div>
                        </form>
                        <div class="mt-4">
                            <span>Do not have an account? </span><a class="text-decoration-underline" href="/profile/register/">Sign Up</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
