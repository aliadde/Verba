{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Verba{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{% static 'verba/vendor/css/tabler.min.css' %}"
    >
    {% block extra_css %}
    <style>
      :root {
        --bg: #0a0a26;
        --surface: rgba(255, 255, 255, 0.05);
        --surface-hover: rgba(255, 255, 255, 0.09);
        --border: rgba(255, 255, 255, 0.10);
        --text: #ebe9fc;
        --text-muted: #a9a6d6;
        --accent-1: #6c63ff;
        --accent-2: #2dd4bf;
        --accent-3: #f59e0b;
        --accent-4: #f472b6;
      }

      /* پس‌زمینه با یک درخشش ملایم */
      .base_background_color {
        background:
          radial-gradient(900px 400px at 85% -10%, rgba(108, 99, 255, 0.25), transparent 60%),
          radial-gradient(700px 350px at -10% 110%, rgba(45, 212, 191, 0.12), transparent 60%),
          var(--bg);
        min-height: 100vh;
      }

      /* نوار بالا: گرادیان و سایه */
      .navbar_base_color {
        background: linear-gradient(90deg, #1e1b6e 0%, #342bd8 100%);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
        border-bottom: 1px solid var(--border);
      }
      .navbar_base_color .nav-link { border-radius: 8px; transition: background .2s; }
      .navbar_base_color .nav-link:hover { background: rgba(255, 255, 255, 0.12); }
      .navbar_base_color .nav-item.active .nav-link { background: rgba(255, 255, 255, 0.18); }

      #login-button {
        background: rgba(255, 255, 255, 0.12);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 18px;
        transition: background .2s, transform .2s;
      }
      #login-button:hover {
        background: rgba(255, 255, 255, 0.22);
        transform: translateY(-1px);
      }

      .text_color { color: var(--text); }
      .text_color_secoundary { color: var(--text-muted); }

      /* کارت یادداشت */
      .note-card {
        --accent: var(--accent-1);
        position: relative;
        overflow: hidden;
        background: var(--surface);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        transition: transform .2s ease, background .2s ease, box-shadow .2s ease, border-color .2s ease;
        animation: noteFadeIn .45s ease both;
      }
      /* نوار رنگی کنار کارت */
      .note-card::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 5px;
        background: var(--accent);
        box-shadow: 0 0 18px var(--accent);
      }
      .note-card:hover {
        background: var(--surface-hover);
        border-color: var(--accent);
        transform: translateY(-3px);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      }
      .note-card .card-body { padding: 1.1rem 1.4rem 1.1rem 1.7rem; }

      .note-title {
        color: var(--text);
        font-size: 1.3rem;
        font-weight: 600;
        line-height: 1.5;
        margin: 0 0 .35rem;
      }
      .note-subtitle {
        color: var(--text-muted);
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.6;
        margin: 0;
        padding-top: .5rem;
        border-top: 1px dashed var(--border);
      }

      /* رنگ‌های متفاوت برای هر کارت */
      .accent-1 { --accent: var(--accent-1); }
      .accent-2 { --accent: var(--accent-2); }
      .accent-3 { --accent: var(--accent-3); }
      .accent-4 { --accent: var(--accent-4); }

      /* تاخیر ورود پله‌ای */
      .note-list > :nth-child(1) { animation-delay: .00s; }
      .note-list > :nth-child(2) { animation-delay: .06s; }
      .note-list > :nth-child(3) { animation-delay: .12s; }
      .note-list > :nth-child(4) { animation-delay: .18s; }
      .note-list > :nth-child(5) { animation-delay: .24s; }

      @keyframes noteFadeIn {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* حالت خالی */
      .empty-state {
        text-align: center;
        padding: 4rem 1rem;
        color: var(--text-muted);
        border: 1px dashed var(--border);
        border-radius: 16px;
        background: var(--surface);
      }
      .empty-state .emoji { font-size: 2.5rem; display: block; margin-bottom: .5rem; }

      /* عنوان صفحه */
      .page-heading {
        color: var(--text);
        font-weight: 700;
        margin-bottom: 1.2rem;
      }
      .page-heading small { color: var(--text-muted); font-weight: 400; font-size: .9rem; margin-inline-start: .5rem; }

      @media (prefers-reduced-motion: reduce) {
        .note-card { animation: none; transition: none; }
      }
      /* ===== صفحه‌ی پروفایل ===== */
      .profile-wrap {
        max-width: 900px;
        margin: 0 auto;
      }

      .profile-header {
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.4rem;
        padding: 1.8rem;
        background: var(--surface);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3);
        animation: noteFadeIn .45s ease both;
      }
      /* درخشش پشت کارت هدر */
      .profile-header::before {
        content: "";
        position: absolute;
        inset: -60% auto auto -10%;
        width: 380px;
        height: 380px;
        background: radial-gradient(circle, rgba(108, 99, 255, 0.35), transparent 65%);
        pointer-events: none;
      }

      .profile-avatar {
        position: relative;
        flex-shrink: 0;
        width: 84px;
        height: 84px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.2rem;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(135deg, var(--accent-1), var(--accent-4));
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.08), 0 0 28px rgba(108, 99, 255, 0.55);
      }

      .profile-info { position: relative; min-width: 0; }
      .profile-label {
        color: var(--text-muted);
        font-size: .85rem;
        letter-spacing: .08em;
        text-transform: uppercase;
        margin: 0;
      }
      .profile-name {
        color: var(--text);
        font-size: 1.9rem;
        font-weight: 700;
        margin: .1rem 0 0;
        overflow-wrap: anywhere;
      }

      /* ===== دکمه‌ی ادیت پروفایل ===== */
      .edit-btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: .45rem;
        flex-shrink: 0;
        padding: 8px 20px;
        color: var(--text);
        font-weight: 600;
        text-decoration: none;
        background: linear-gradient(135deg, rgba(108, 99, 255, 0.55), rgba(244, 114, 182, 0.45));
        border: 1px solid var(--border);
        border-radius: 999px;
        box-shadow: 0 4px 14px rgba(108, 99, 255, 0.35);
        transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
      }
      .edit-btn:hover {
        color: #fff;
        transform: translateY(-2px);
        box-shadow: 0 8px 22px rgba(108, 99, 255, 0.55);
      }
      .edit-btn:active { transform: translateY(0); }
      .edit-btn:focus-visible {
        outline: 2px solid var(--accent-2);
        outline-offset: 3px;
      }

      /* ===== کارت‌های آماری ===== */
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1rem;
        margin-top: 1rem;
      }
      .stat-card {
        --accent: var(--accent-1);
        position: relative;
        overflow: hidden;
        padding: 1.3rem 1.5rem 1.3rem 1.8rem;
        background: var(--surface);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        transition: transform .2s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
        animation: noteFadeIn .45s ease both;
      }
      .stat-card::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 5px;
        background: var(--accent);
        box-shadow: 0 0 18px var(--accent);
      }
      .stat-card:hover {
        background: var(--surface-hover);
        border-color: var(--accent);
        transform: translateY(-3px);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      }
      .stat-icon { font-size: 1.5rem; margin-bottom: .3rem; display: block; }
      .stat-label {
        color: var(--text-muted);
        font-size: .9rem;
        margin: 0;
      }
      .stat-value {
        color: var(--text);
        font-size: 2.2rem;
        font-weight: 700;
        line-height: 1.2;
        margin: .15rem 0 0;
      }

      .stat-grid > :nth-child(1) { animation-delay: .08s; }
      .stat-grid > :nth-child(2) { animation-delay: .16s; }

      /* ===== موبایل ===== */
      @media (max-width: 576px) {
        .profile-header { flex-direction: column; justify-content: center; text-align: center; }
      }

      /* ===== کاهش حرکت ===== */
      @media (prefers-reduced-motion: reduce) {
        .profile-header, .stat-card { animation: none; transition: none; }
      }

      /* ===== صفحه‌ی Login / Register ===== */
      .auth-wrap {
        min-height: calc(100vh - 140px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
      }

      .auth-card {
        position: relative;
        overflow: hidden;
        width: 100%;
        max-width: 440px;
        padding: 2.2rem 2rem;
        background: var(--surface);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
        animation: noteFadeIn .5s ease both;
      }
      /* درخشش بنفش بالای کارت */
      .auth-card::before {
        content: "";
        position: absolute;
        inset: -40% -20% auto -20%;
        height: 260px;
        background: radial-gradient(ellipse at center, rgba(108, 99, 255, 0.35), transparent 65%);
        pointer-events: none;
      }
      .auth-card > * { position: relative; }

      .auth-logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 1rem;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(135deg, var(--accent-1), var(--accent-4));
        box-shadow: 0 0 28px rgba(108, 99, 255, 0.55);
      }
      .auth-title {
        color: var(--text);
        text-align: center;
        font-size: 1.7rem;
        font-weight: 700;
        margin: 0 0 .25rem;
      }
      .auth-subtitle {
        color: var(--text-muted);
        text-align: center;
        margin: 0 0 1.6rem;
      }

      .auth-field { margin-bottom: 1.1rem; }
      .auth-label {
        display: block;
        color: var(--text-muted);
        font-size: .9rem;
        font-weight: 500;
        margin-bottom: .4rem;
      }

      /* فیلدهای فرم (هم ویجت‌های جنگو، هم input معمولی) */
      .auth-card input[type="text"],
      .auth-card input[type="password"],
      .auth-card input[type="email"] {
        width: 100%;
        padding: 11px 14px;
        color: var(--text);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border);
        border-radius: 12px;
        outline: none;
        transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
      }
      .auth-card input::placeholder { color: rgba(169, 166, 214, 0.55); }
      .auth-card input:focus {
        background: rgba(255, 255, 255, 0.09);
        border-color: var(--accent-1);
        box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.25);
        color: var(--text);
      }

      .auth-error {
        color: #ff8fa3;
        background: rgba(255, 77, 109, 0.12);
        border: 1px solid rgba(255, 77, 109, 0.3);
        border-radius: 12px;
        padding: .6rem .9rem;
        margin-bottom: 1rem;
        font-size: .9rem;
      }
      .auth-error ul { margin: 0; padding: 0; list-style: none; }

      .auth-submit {
        width: 100%;
        padding: 11px 18px;
        margin-top: .4rem;
        color: #fff;
        font-weight: 600;
        background: linear-gradient(135deg, var(--accent-1), #8b5cf6 55%, var(--accent-4));
        border: 0;
        border-radius: 999px;
        box-shadow: 0 6px 20px rgba(108, 99, 255, 0.45);
        transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
        cursor: pointer;
      }
      .auth-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 28px rgba(108, 99, 255, 0.6);
        filter: brightness(1.08);
      }
      .auth-submit:active { transform: translateY(0); }
      .auth-submit:focus-visible {
        outline: 2px solid var(--accent-2);
        outline-offset: 3px;
      }

      .auth-footer {
        margin-top: 1.5rem;
        padding-top: 1.2rem;
        text-align: center;
        color: var(--text-muted);
        border-top: 1px dashed var(--border);
      }
      .auth-footer a {
        color: var(--accent-2);
        font-weight: 600;
        text-decoration: none;
        margin-inline-start: .25rem;
      }
      .auth-footer a:hover { text-decoration: underline; }

      @media (prefers-reduced-motion: reduce) {
        .auth-card { animation: none; }
        .auth-submit, .auth-card input { transition: none; }
      }
      /* ===== مخصوص صفحه‌ی Register ===== */

      /* ایمیل هم مثل بقیه‌ی فیلدها (اگر type=email باشد، قبلاً پوشش داده شده؛ این برای اطمینان است) */
      .auth-card input[type="email"] { width: 100%; }

      /* خطای زیر هر فیلد (مثلاً «این نام کاربری قبلاً گرفته شده») */
      .auth-field-error {
        color: #ff8fa3;
        font-size: .82rem;
        margin-top: .35rem;
      }
      .auth-field-error ul { margin: 0; padding: 0; list-style: none; }

      /* راهنمای زیر فیلد رمز عبور (help_text جنگو) */
      .auth-help {
        color: var(--text-muted);
        font-size: .78rem;
        line-height: 1.6;
        margin-top: .35rem;
        opacity: .85;
      }
      .auth-help ul { margin: 0; padding-inline-start: 1.1rem; }

      /* فیلدی که خطا دارد: لبه‌ی قرمز ملایم */
      .auth-field.has-error input {
        border-color: rgba(255, 77, 109, 0.6);
      }
      .auth-field.has-error input:focus {
        box-shadow: 0 0 0 4px rgba(255, 77, 109, 0.2);
      }

      /* دو فیلد کنار هم در دسکتاپ (رمز و تکرار رمز) */
      .auth-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 .9rem;
      }
      @media (max-width: 576px) {
        .auth-row { grid-template-columns: 1fr; }
      }

      /* کارت Register کمی عریض‌تر از Login */
      .auth-card.auth-card-wide { max-width: 520px; }

      /* ===== مخصوص صفحه‌ی Edit Profile ===== */

      /* دو دکمه کنار هم: ذخیره و لغو */
      .auth-actions {
        display: flex;
        gap: .8rem;
        margin-top: .6rem;
      }
      .auth-actions .auth-submit { margin-top: 0; flex: 1; }

      .auth-cancel {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 11px 22px;
        color: var(--text);
        font-weight: 600;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--border);
        border-radius: 999px;
        transition: background .2s ease, transform .2s ease;
      }
      .auth-cancel:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.16);
        transform: translateY(-2px);
      }
      .auth-cancel:focus-visible {
        outline: 2px solid var(--accent-2);
        outline-offset: 3px;
      }

      /* پیام‌های موفقیت (django messages) */
      .auth-success {
        color: #6ee7b7;
        background: rgba(45, 212, 191, 0.12);
        border: 1px solid rgba(45, 212, 191, 0.3);
        border-radius: 12px;
        padding: .6rem .9rem;
        margin-bottom: 1rem;
        font-size: .9rem;
      }

      /* آواتار کوچک بالای فرم */
      .auth-avatar {
        width: 72px;
        height: 72px;
        margin: 0 auto 1rem;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.9rem;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(135deg, var(--accent-1), var(--accent-4));
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.08), 0 0 28px rgba(108, 99, 255, 0.55);
      }

      @media (max-width: 576px) {
        .auth-actions { flex-direction: column-reverse; }
      }
      /* ===== مخصوص صفحه‌ی Add Note ===== */
      .auth-card textarea {
        width: 100%;
        min-height: 96px;
        padding: 11px 14px;
        color: var(--text);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border);
        border-radius: 12px;
        outline: none;
        resize: vertical;
        line-height: 1.7;
        transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
      }
      .auth-card textarea::placeholder { color: rgba(169, 166, 214, 0.55); }
      .auth-card textarea:focus {
        background: rgba(255, 255, 255, 0.09);
        border-color: var(--accent-1);
        box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.25);
        color: var(--text);
      }
      .auth-field.has-error textarea { border-color: rgba(255, 77, 109, 0.6); }
      .auth-field.has-error textarea:focus { box-shadow: 0 0 0 4px rgba(255, 77, 109, 0.2); }

      /* شمارنده‌ی کاراکتر */
      .char-counter {
        text-align: end;
        color: var(--text-muted);
        font-size: .78rem;
        margin-top: .3rem;
        opacity: .8;
      }

      /* دکمه‌ی «Add Note» در صفحه‌ی Home */
      .add-note-btn {
        display: inline-flex;
        align-items: center;
        gap: .4rem;
        padding: 8px 20px;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
        background: linear-gradient(135deg, var(--accent-1), #8b5cf6 55%, var(--accent-4));
        border-radius: 999px;
        box-shadow: 0 4px 14px rgba(108, 99, 255, 0.4);
        transition: transform .2s ease, box-shadow .2s ease;
      }
      .add-note-btn:hover {
        color: #fff;
        transform: translateY(-2px);
        box-shadow: 0 8px 22px rgba(108, 99, 255, 0.6);
      }
      .add-note-btn:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 3px; }

      /* لینک روی عنوان کارت: شبیه متن عادی بماند */
      .note-link,
      .note-link:hover {
        color: inherit;
        text-decoration: none;
      }
      .note-link:focus-visible {
        outline: 2px solid var(--accent-2);
        outline-offset: 4px;
        border-radius: 8px;
      }

      /* ===== صفحه‌ی جزئیات یادداشت ===== */
      .note-detail {
        --accent: var(--accent-1);
        position: relative;
        overflow: hidden;
        max-width: 760px;
        margin: 0 auto;
        padding: 2rem 2rem 2rem 2.4rem;
        background: var(--surface);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
        animation: noteFadeIn .45s ease both;
      }
      .note-detail::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 6px;
        background: var(--accent);
        box-shadow: 0 0 20px var(--accent);
      }
      .note-detail-label {
        color: var(--text-muted);
        font-size: .8rem;
        letter-spacing: .08em;
        text-transform: uppercase;
        margin: 0 0 .4rem;
      }
      .note-detail-text {
        color: var(--text);
        font-size: 1.25rem;
        line-height: 1.8;
        margin: 0 0 1.6rem;
        white-space: pre-wrap;      /* خط‌های جدید یادداشت حفظ شود */
        overflow-wrap: anywhere;
      }
      .note-detail-text.secondary {
        color: var(--text-muted);
        font-size: 1.1rem;
        padding-top: 1.2rem;
        border-top: 1px dashed var(--border);
      }
      .note-detail-meta {
        color: var(--text-muted);
        font-size: .85rem;
        margin: 0;
      }
      .note-detail-actions { margin-top: 1.6rem; }

      @media (prefers-reduced-motion: reduce) {
        .note-detail { animation: none; }
      }

      .note-detail-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: .8rem;
        margin-top: 1.6rem;
      }

<body>
    <div class="page base_background_color ">
        <div class="page-wrapper">
          <!-- header -->
            <header class="navbar navbar-expand-md d-print-none navbar_base_color">
                <div class="container-xl ">

                        data-bs-toggle="collapse" data-bs-target="#navbar-menu"
                        aria-controls="navbar-menu" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon">

                        </span>
                    </button>

                    <div class="collapse navbar-collapse" id="navbar-menu">
                        <ul class="navbar-nav">
                          <li id="nav-link-home" class="nav-item">
                            <a class="nav-link" href="{% url 'home' %}" onclick="home_button_clicked()">
                              <span class="nav-link-icon">
                                <!-- Download SVG icon from http://tabler.io/icons/icon/home -->

                                  <path d="M5 12l-2 0l9 -9l9 9l-2 0" />
                                  <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7" />
                                  <path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6" />
                                </svg>
                              </span>
                              <span class="nav-link-title text_color">Home</span>
                            </a>
                          </li>
                          <li id="nav-link-profile" class="nav-item">
                            <a class="nav-link" href="{% url 'profile' %}">
                              <span class="nav-link-icon">
                                <!-- Download SVG icon from http://tabler.io/icons/icon/checkbox -->
                                <svg  class="text_color" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" class="icon">
                                  <path d="M9 11l3 3l8 -8" />
                                  <path d="M20 12v6a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h9" />
                                </svg>

                        </ul>
                      </div>
                    <a href="/profile/login/" class="btn" role="button" id="login-button">Log In/Sign Up</a>
                </div>
            </header>
            {% block content %}{% endblock %}

            <script src="{% static 'verba/vendor/js/tabler.min.js' %}"></script>

            {% block extra_js %}
            <script>
              function getCookie(name) {
                const cookies = document.cookie.split(";");

                for (const cookie of cookies) {
                    const [key, ...value] = cookie.trim().split("=");

                    if (key === name) {
                        return decodeURIComponent(value.join("="));
                    }
                }

                return null;
              }

              document.addEventListener("DOMContentLoaded", () => {
                const currentPath = window.location.pathname;

                const homeNav = document.getElementById("nav-link-home");
                const profileNav = document.getElementById("nav-link-profile");

                homeNav.classList.remove("active");
                profileNav.classList.remove("active");

                if (currentPath === "/" || currentPath === "/note/") {
                    homeNav.classList.add("active");
                }
                else if (currentPath === "/profile/") {
                    profileNav.classList.add("active");
                }
              });

              document.addEventListener("DOMContentLoaded", () => {
                login_button = document.getElementById("login-button");
                const logged_in_status = getCookie("logged_in");
                if (logged_in_status){
                  login_button.textContent = "Log Out";
                  login_button.href = "/profile/logout/";
                }
              });

          </script>
            {% endblock %}
        </div>
    </div>
</body>
</html>
